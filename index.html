<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Developer Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>GitHub Developer Explorer</h1>

        <form id="searchForm">
            <input
                type="text"
                id="usernameInput"
                placeholder="Enter GitHub username"
            >

            <button type="submit">
                Search
            </button>
        </form>

        <p id="loading"></p>
        <p id="error"></p>

        <section id="results"></section>
    </main>

    <script type="module" src="./js/app.js"></script>

</body>
</html>
